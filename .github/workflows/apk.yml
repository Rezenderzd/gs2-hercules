name: Gerar APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true

      - run: flutter pub get

      - name: Instalar SQLite para os testes
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Análise estática
        run: flutter analyze

      - name: Testes automatizados
        run: flutter test

      - name: Compilar APK de release
        run: >
          flutter build apk --release
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Guardar o APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: sao-paulo-atento-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publicar em Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: São Paulo Atento ${{ github.ref_name }}
          body: APK de release gerado automaticamente pelo GitHub Actions.
          files: build/app/outputs/flutter-apk/app-release.apk
